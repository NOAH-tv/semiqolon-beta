 {
  "id": "classic-daodejing-64",
  "text": "천 리 길도\n한 걸음에서 시작된다.",
  "title": "첫걸음",
  "author": "노자",
  "work": "도덕경",
  "section": "64장",
  "sourceUrl": "https://ctext.org/text.pl?if=en&node=11655&show=parallel",
  "reference": "千里之行，始於足下。",
  "referenceLabel": "한문 원문",
  "translation": "한문에서 직접 옮긴 한국어 번역 초안"
 },
 {
  "id": "classic-enchiridion-1",
  "text": "우리 뜻대로 할 수 있는 일이 있고,\n그렇지 않은 일이 있다.",
  "title": "우리의 몫",
  "author": "에픽테토스",
  "work": "엥케이리디온",
  "section": "1절",
  "sourceUrl": "https://classics.mit.edu/Epictetus/epicench.html",
  "reference": "Some things are in our control and others not.",
  "referenceLabel": "Elizabeth Carter 영문 번역",
  "translation": "Elizabeth Carter의 영문역을 바탕으로 옮긴 한국어 번역 초안"
 },
 {
  "id": "classic-analects-15-30",
  "text": "잘못하고도 고치지 않는 것,\n그것이 잘못이다.",
  "title": "고치는 일",
  "author": "공자",
  "work": "논어",
  "section": "위령공편 30장",
  "sourceUrl": "https://ctext.org/text.pl?if=gb&node=1510&remap=gb&show=parallel",
  "reference": "過而不改，是謂過矣。",
  "referenceLabel": "한문 원문",
  "translation": "한문에서 직접 옮긴 한국어 번역 초안"
 },
 {
  "id": "classic-meditations-10-16",
  "text": "좋은 사람이 어떤 사람인지\n그만 논하고, 그런 사람이 되어라.",

  "author": "마르쿠스 아우렐리우스",
  "work": "명상록",
  "section": "10권 16절",
  "sourceUrl": "https://classics.mit.edu/Antoninus/meditations.10.ten.html",
  "reference": "No longer talk at all about the kind of man that a good man ought to be, but be such.",
  "referenceLabel": "George Long 영문 번역",
  "translation": "George Long의 영문역을 바탕으로 옮긴 한국어 번역 초안"
 },
 {
  "id": "classic-daodejing-33",
  "text": "남을 이기는 사람은 힘이 있고,\n자신을 이기는 사람은 강하다.",
  "title": "강함",
  "author": "노자",
  "work": "도덕경",
  "section": "33장",
  "sourceUrl": "https://ctext.org/dictionary.pl?id=11624&if=en",
  "reference": "勝人者有力，自勝者強。",
  "referenceLabel": "한문 원문",
  "translation": "한문에서 직접 옮긴 한국어 번역 초안"
 },
 {
  "id": "classic-analects-2-17",
  "text": "아는 것을 안다고 하고,\n모르는 것을 모른다고 하는 것.\n그것이 아는 것이다.",
  "title": "앎",
  "author": "공자",
  "work": "논어",
  "section": "위정편 17장",
  "sourceUrl": "https://ctext.org/analects/wei-zheng/zh",
  "reference": "知之為知之，不知為不知，是知也。",
  "referenceLabel": "한문 원문",
  "translation": "한문에서 직접 옮긴 한국어 번역 초안"
 },
 {
  "id": "classic-analects-7-22",
  "text": "세 사람이 함께 걸으면,\n그중에는 반드시 나의 스승이 있다.",
  "title": "배움",
  "author": "공자",
  "work": "논어",
  "section": "술이편 22장 중",
  "sourceUrl": "https://ctext.org/text.pl?if=gb&node=1272&show=parallel",
  "reference": "三人行，必有我師焉。",
  "referenceLabel": "한문 원문",
  "translation": "한문에서 직접 옮긴 한국어 번역 초안"
 },
 {
  "id": "classic-daodejing-8",
  "text": "가장 높은 선은 물과 같다.\n물은 만물을 이롭게 하면서도\n다투지 않는다.",
  "title": "물처럼",
  "author": "노자",
  "work": "도덕경",
  "section": "8장 중",
  "sourceUrl": "https://ctext.org/text.pl?if=en&node=11599&show=parallel",
  "reference": "上善若水。水善利萬物而不爭。",
  "referenceLabel": "한문 원문",
  "translation": "한문에서 직접 옮긴 한국어 번역 초안"
 },
 {
  "id": "classic-meditations-4-49",
  "text": "파도가 끊임없이 부딪쳐도\n굳게 서 있는 바위처럼 되어라.",
  "title": "흔들림 앞에서",
  "author": "마르쿠스 아우렐리우스",
  "work": "명상록",
  "section": "4권 49절 중",
  "sourceUrl": "https://classics.mit.edu/Antoninus/meditations.4.four.html",
  "reference": "Be like the promontory against which the waves continually break, but it stands firm and tames the fury of the water around it.",
  "referenceLabel": "George Long 영문 번역",
  "translation": "George Long의 영문역 앞부분을 바탕으로 옮긴 한국어 번역 초안"
 },
 {
  "id": "classic-analects-2-15",
  "text": "배우기만 하고 생각하지 않으면 막막하고,\n생각만 하고 배우지 않으면 위태롭다.",
  "title": "배움과 생각",
  "author": "공자",
  "work": "논어",
  "section": "위정편 15장",
  "sourceUrl": "https://ctext.org/analects/wei-zheng/zh",
  "reference": "學而不思則罔，思而不學則殆。",
  "referenceLabel": "한문 원문",
  "translation": "한문에서 직접 옮긴 한국어 번역 초안"
 },
 {
  "id": "classic-hamlet-1-3",
  "text": "무엇보다도,\n자기 자신에게 진실하라.",
  "title": "진실함",
  "author": "윌리엄 셰익스피어",
  "work": "햄릿",
  "section": "1막 3장",
  "sourceUrl": "https://www.folger.edu/explore/shakespeares-works/hamlet/read/1/3/",
  "reference": "This above all: to thine own self be true,",
  "referenceLabel": "영문 대사",
  "translation": "영문에서 직접 옮긴 한국어 번역 초안",
  "context": "폴로니어스가 아들 레어티스에게 건네는 충고 중 한 구절입니다."
 },
 {
  "id": "classic-meditations-4-20",
  "text": "아름다운 것은 그 자체로 아름답다.\n칭찬은 그 아름다움의 일부가 아니다.",
  "title": "그 자체로",
  "author": "마르쿠스 아우렐리우스",
  "work": "명상록",
  "section": "4권 20절 중",
  "sourceUrl": "https://classics.mit.edu/Antoninus/meditations.4.four.html",
  "reference": "Everything which is in any way beautiful is beautiful in itself, and terminates in itself, not having praise as part of itself.",
  "referenceLabel": "George Long 영문 번역",
  "translation": "George Long의 영문역을 바탕으로 옮긴 한국어 번역 초안"
 }

/* ---------------- 물 표면: 높이장 파동 ---------------- */
let GW = 229, GH = 500, CELL = 1.7, SPS = 100, DAMP = 0.99, VISC = 0.02, A, B, D, D2, simCv = null, simCtx = null, img = null;
function initSim(){
  const oW = GW, oH = GH, oA = A, oB = B, oD = D;
  GW = Math.round(clamp(innerWidth / 1.7, 200, 640));                // 격자 한 칸 ≈ 화면 1.7px
  GH = Math.round(clamp(GW * innerHeight / Math.max(1, innerWidth), 150, 900));
  A = new Float32Array(GW * GH); B = new Float32Array(GW * GH);
  D = new Float32Array(GW * GH).fill(1); D2 = new Float32Array(GW * GH);
  if (oA && oA.length === oW * oH){                                   // 화면 크기가 바뀌어도 물결과 어둠을 그대로 옮겨 담는다
    const move = (src, dst) => {
      for (let y = 0; y < GH; y++){
        const fy = y * (oH - 1) / Math.max(1, GH - 1), y0 = Math.floor(fy), y1 = Math.min(oH - 1, y0 + 1), ty = fy - y0;
        for (let x = 0; x < GW; x++){
          const fx = x * (oW - 1) / Math.max(1, GW - 1), x0 = Math.floor(fx), x1 = Math.min(oW - 1, x0 + 1), tx = fx - x0;
          dst[y * GW + x] = (src[y0 * oW + x0] * (1 - tx) + src[y0 * oW + x1] * tx) * (1 - ty) + (src[y1 * oW + x0] * (1 - tx) + src[y1 * oW + x1] * tx) * ty;
        }
      }
    };
    move(oA, A); move(oB, B); move(oD, D);
  }
  CELL = innerWidth / GW;
  SPS = SPEED_PX / CELL / Math.SQRT1_2;                               // 격자 한 걸음에 물결은 0.7칸 간다
  DAMP = Math.exp(Math.log(0.75) / SPS);                              // 긴 물결은 멀리 간다(1초에 75%로)
  VISC = 0.02 * 1.667 / CELL;                                         // 짧은 물결일수록 빨리 잦아든다(물의 끈기)
  for (const b of BANDS) b.lam = Math.max(6, SPEED_PX / b.hz / CELL); // 그 대역의 파장(칸)
  if (gl) glSize(); else make2DSim();
}
function make2DSim(){ simCv = document.createElement("canvas"); simCv.width = GW; simCv.height = GH; simCtx = simCv.getContext("2d"); img = simCtx.createImageData(GW, GH); }
function step(){
  const g = GW, d = DAMP, a = A, b = B;
  for (let y = 1; y < GH - 1; y++){
    let i = y * g + 1;
    for (let x = 1; x < g - 1; x++, i++) b[i] = ((a[i - 1] + a[i + 1] + a[i - g] + a[i + g]) * 0.5 - b[i]) * d;
  }
  const last = (GH - 1) * g;                                          // 가장자리는 벽 대신 열린 물처럼(기울기 0)
  for (let x = 0; x < g; x++){ b[x] = b[x + g]; b[last + x] = b[last - g + x]; }
  for (let y = 0; y < GH; y++){ const i = y * g; b[i] = b[i + 1]; b[i + g - 1] = b[i + g - 2]; }
  const M = SPONGE.length;                                            // 가장자리 띠에서 물결을 삼켜 되튀지 않게 한다
  for (let y = 0; y < GH; y++){
    const row = y * g, fy = y < M ? SPONGE[y] : y >= GH - M ? SPONGE[GH - 1 - y] : 1;
    if (fy < 1){ for (let x = 0; x < g; x++){ const fx = x < M ? SPONGE[x] : x >= g - M ? SPONGE[g - 1 - x] : 1; b[row + x] *= fx < fy ? fx : fy; } }
    else { for (let x = 0; x < M; x++){ b[row + x] *= SPONGE[x]; b[row + g - 1 - x] *= SPONGE[x]; } }
  }
  A = b; B = a;
}
const SPONGE = Float32Array.from({ length: 18 }, (_, e) => 1 - 0.1 * Math.pow((18 - e) / 18, 2));
function soften(eps){
  const a = A, b = B, g = GW;
  for (let y = 1; y < GH - 1; y++){
    let i = y * g + 1;
    for (let x = 1; x < g - 1; x++, i++){
      a[i] += eps * (a[i - 1] + a[i + 1] + a[i - g] + a[i + g] - 4 * a[i]);
      b[i] += eps * (b[i - 1] + b[i + 1] + b[i - g] + b[i + g] - 4 * b[i]);
    }
  }
}
function emitRing(x, y, lam, amp){                                   // 바깥으로 퍼져 나가는 물결 고리 하나(파장 lam칸)
  const cx = x * GW, cy = y * GH, R0 = 0.5 * lam, sr = 0.28 * lam, k = 2 * Math.PI / lam, is2 = 1 / (sr * sr), R = R0 + 2 * sr, R2 = R * R;
  const rin = 0.1 * lam, rw = 0.25 * lam;                            // 한가운데는 비워 둔다(물결이 가운데로 모여 뾰족해지지 않게)
  const x0 = Math.max(1, Math.floor(cx - R)), x1 = Math.min(GW - 2, Math.ceil(cx + R));
  const y0 = Math.max(1, Math.floor(cy - R)), y1 = Math.min(GH - 2, Math.ceil(cy + R));
  for (let yy = y0; yy <= y1; yy++){
    const dy = yy - cy;
    for (let xx = x0; xx <= x1; xx++){
      const dx = xx - cx, d2 = dx * dx + dy * dy;
      if (d2 >= R2) continue;
      const i = yy * GW + xx, r = Math.sqrt(d2), u = r - R0, v = u + Math.SQRT1_2;   // 한 걸음 전에는 조금 안쪽에 있었다 → 바깥으로 간다
      const ta = smooth(0, 1, (r - rin) / rw), tb = smooth(0, 1, (r + Math.SQRT1_2 - rin) / rw);
      A[i] += amp * ta * Math.cos(k * u) * Math.exp(-u * u * is2);
      B[i] += amp * tb * Math.cos(k * v) * Math.exp(-v * v * is2);
    }
  }
}
function ring(x, y, lamPx, amp){ emitRing(x, y, Math.max(6, lamPx / CELL), amp); }   // lamPx: 파장(화면 px)
function clearAround(x, y, r, k){
  const cx = x * GW, cy = y * GH, R = r * GW;
  for (let yy = 0; yy < GH; yy++) for (let xx = 0; xx < GW; xx++){
    const d = Math.hypot(xx - cx, yy - cy);
    if (d < R){ const i = yy * GW + xx; D[i] *= 1 - k * (1 - d / R); }
  }
}
const THR = 0.12;                                                    // 이보다 잔잔한 물결은 어둠을 건드리지 않는다
let dFrame = 0;
function updateDark(dt, cap, sweep, gain){
  const g = GW, n = g * GH;
  if (sweep > 0){
    const cx = GW * 0.5, cy = GH * 0.42, R = sweep * Math.max(GW, GH), k = Math.pow(0.02, dt);
    for (let yy = 0; yy < GH; yy++) for (let xx = 0; xx < GW; xx++){
      if (Math.hypot(xx - cx, yy - cy) < R) D[yy * GW + xx] *= k;
    }
  }
  if (gain > 0){                                                      // 목소리 물결이 지나간 자리는 맑아진다
    const c = CELL / 1.667, thr = THR * c, k = gain * dt / c;
    for (let y = 1; y < GH - 1; y++){
      let i = y * g + 1;
      for (let x = 1; x < g - 1; x++, i++){
        const m = Math.abs(A[i + 1] - A[i - 1]) + Math.abs(A[i + g] - A[i - g]) - thr;
        if (m > 0){ const v = D[i] - m * k; D[i] = v < 0 ? 0 : v; }
      }
    }
  }
  if (cap < 1) for (let i = 0; i < n; i++) if (D[i] > cap) D[i] = cap;
  if (++dFrame % 3 === 0){
    for (let y = 1; y < GH - 1; y++){ let i = y * g + 1; for (let x = 1; x < g - 1; x++, i++) D2[i] = (D[i] * 4 + D[i - 1] + D[i + 1] + D[i - g] + D[i + g]) * 0.125; }
    for (let y = 1; y < GH - 1; y++){ let i = y * g + 1; for (let x = 1; x < g - 1; x++, i++) D[i] = D2[i]; }
  }
}

   높이를 부드럽게(3차) 이어서 한 화소마다 물결의 기울기를 구한다.
   → 잔잔할 때는 물빛 색만. 물결이 지나갈 때만 은은한 명암과 윤기, 먹이 풀리듯 번지는 어둠,

float hash(vec2 p){ p = fract(p * vec2(233.34, 851.73)); p += dot(p, p + 23.45); return fract(p.x * p.y); }
float vnoise(vec2 p){

function render2D(){

  ctx.drawImage(simCv, 0, 0, W, H);
  for (const fl of flashes){
    const R = (0.1 + fl.t * 0.55) * Math.max(W, H), a = (1 - fl.t / 1.6) * 0.55;
    const g = ctx.createRadialGradient(fl.x * W, fl.y * H, 0, fl.x * W, fl.y * H, R);
    g.addColorStop(0, `rgba(235,250,255,${a.toFixed(3)})`); g.addColorStop(1, "rgba(235,250,255,0)");

    const g = ctx.createRadialGradient(x, y, 0, x, y, R);
    g.addColorStop(0, `rgba(${P},${(0.36 * glowA).toFixed(3)})`); g.addColorStop(1, `rgba(${P},0)`);

  }

}

function edgeTick(f){
  const binHz = V.ac && V.an ? V.ac.sampleRate / V.an.fftSize : 23;
  for (let k = 0; k < EN; k++){
    let e = 0;
    if (f){ const bin = clamp(Math.round(90 * Math.pow(5500 / 90, k / (EN - 1)) / binHz), 1, f.length - 2); e = clamp(((f[bin - 1] + f[bin] + f[bin + 1]) / 765 - 0.3) / 0.55, 0, 1); }
    edgeE[k] = e > edgeE[k] ? lerp(edgeE[k], e, 0.5) : edgeE[k] * 0.92;
    edgeB[k] = Math.round(edgeE[k] * 255);
  }
}


 function glassRadius(box,style){const value=style.borderTopLeftRadius,r=parseFloat(value)||0;return Math.min(box.width/2,box.height/2,value.endsWith('%')?Math.min(box.width,box.height)*r/100:r);}
 function glassOpacity(el,style){const nav=el.closest('.bottom-nav');return Number(style.opacity)*(nav&&nav!==el?Number(getComputedStyle(nav).opacity):1)*uiV;}
 function measure(){LENS=[...document.querySelectorAll('.bottom-nav,.nav-glass-indicator'),...document.querySelectorAll('.record-button,.primary,.secondary')].filter(e=>{const b=e.getBoundingClientRect();return b.width>2&&b.bottom>0&&b.top<innerHeight&&getComputedStyle(e).visibility!=='hidden';}).slice(0,5).map(e=>[e,e.classList.contains('nav-glass-indicator')?1.035:1.018]);}
 function resize(){S=Math.min(devicePixelRatio||1,2,Math.sqrt(2400000/(innerWidth*innerHeight)));W=Math.round(innerWidth*S);H=Math.round(innerHeight*S);cv.width=W;cv.height=H;initSim();if(ctx)buildEdge();measure();wake();}
 function setStage(next){if(stage!==next){if(next==='white'){completionAt=performance.now();completion=motion()?0:1;light=Math.max(light,.58);D?.fill(0);if(motion())ring(.5,.44,50,1.4);}else completion=-1;if(next==='welcome')D?.fill(1);else if(next==='rest')D?.fill(0);}stage=next;document.body.dataset.waterStage=stage;cv.dataset.stage=stage;}
 function begin(s){if(s.kind!=='read'){if(s.prayerFor)setStage('prayer');return;}journeyKey=s.attempt;guided=!!s.guided;progressValue=0;complete=false;sweepOn=false;listenRatio=0;lightTarget=guided&&s.take===2?.12:0;light=lightTarget;D?.fill(guided&&s.take===2?0:1);A?.fill(0);B?.fill(0);edgeE.fill(0);edgeB.fill(0);BANDS.forEach(b=>b.e=0);setStage(guided&&s.take===2?'second':'first');cv.dataset.phase=stage==='second'?'clear':'ink';document.body.dataset.readingPhase=cv.dataset.phase;wake();}
 function sound(s){if(s.kind!=='read'||s.attempt!==journeyKey)return;progressValue=Math.max(progressValue,1-Math.exp(-(s.voiceSeconds||0)/5));cv.dataset.phase=progressValue?'opening':'ink';document.body.dataset.readingPhase=cv.dataset.phase;wake();}
 function playback(r,ratio){if(view!=='playback')return;guided=true;setStage('listen');listenRatio=Math.max(listenRatio,ratio);cv.dataset.listenProgress=listenRatio.toFixed(3);wake();}
 function refresh(){if(view==='reading'&&session){if(session.attempt!==journeyKey)begin(session);else setStage(session.guided&&session.take===2?'second':'first');}else if(view==='playback'){setStage('listen');}else if(view==='done'){setStage('white');}else setStage(view==='journal'?'rest':['practice','tuning','mouth'].includes(view)?'coach':'welcome');measure();wake();}
 function voice(r,rms){V.ac=r.ac;V.an=r.an;voiceAt=performance.now();talking=rms>.004;if(!frequency||frequency.length!==r.an.frequencyBinCount)frequency=new Uint8Array(r.an.frequencyBinCount);r.an.getByteFrequencyData(frequency);const el=document.querySelector('.record-button')||$('mouth-camera')||document.querySelector('.tuner-readout')||$('listen-toggle');if(el){const box=el.getBoundingClientRect();bandX=clamp((box.left+box.width/2)/innerWidth,.03,.97);bandY=clamp((box.top+box.height/2)/innerHeight,.03,.97);glowX=bandX;glowY=bandY;}wake();}
 function frame(now){raf=0;if(document.hidden)return;const dt=Math.min(.05,last?(now-last)/1000:.016);last=now;T+=dt;
 const active=!!(recording||playbackVisual||trainer?.stream)&&now-voiceAt<400,f=active?frequency:null,speaking=active&&talking;
 completion=stage==='white'?(motion()?Math.min(1,(now-completionAt)/2800):1):-1;
 const cap=stage==='first'?(guided?1-.65*progressValue:complete?0:1-.7*progressValue):stage==='listen'?.35*(1-listenRatio):stage==='welcome'?1:stage==='entry'?.82:0;lightTarget=stage==='second'?.12+.36*progressValue:stage==='prayer'?.58:stage==='white'?.58+.42*completion:stage==='coach'?.1:stage==='listen'?.08*listenRatio:stage==='entry'?.025:0;light=stage==='white'?lightTarget:light+(lightTarget-light)*(motion()?1-Math.exp(-dt/.9):1);cv.dataset.completion=completion.toFixed(3);cv.dataset.darkness=cap.toFixed(3);cv.dataset.light=light.toFixed(3);
 if(motion()){bandTick(dt,f,speaking);edgeTick(f);acc+=dt*SPS;let n=0;while(acc>=1&&n<8){bandForce();step();acc--;n++;}if(acc>2)acc=0;if(n)soften(Math.min(.2,VISC*n));if(sweepOn){sweep+=dt*.55;if(sweep>1.4)sweepOn=false;}updateDark(dt,cap,sweepOn?sweep:0,progressValue>0&&speaking?6.6:0);const floor=stage==='first'&&guided?.25:stage==='listen'?.25*(1-listenRatio):0;if(floor)for(let i=0;i<D.length;i++)D[i]=Math.max(floor,D[i]);}
 else{D.fill(cap);edgeV=0;glowA=0;}
 edgeT=active?(speaking?1:.3):0;edgeV+=(edgeT-edgeV)*(1-Math.exp(-dt/.25));glowT=Math.max(speaking?1:active?.35:0,glowT*Math.exp(-dt*1.2));glowA+=(glowT-glowA)*(1-Math.exp(-dt/.25));stepPalette(dt);
 flashes.forEach(f=>f.t+=dt);flashes=flashes.filter(f=>f.t<1.6);if(!motion())flashes=[];
 if(now-lastLayout>250){measure();lastLayout=now;}if(gl)renderGL();else render2D();if(motion())raf=requestAnimationFrame(frame);
 }
 function wake(){if(!raf&&!document.hidden){last=0;raf=requestAnimationFrame(frame);}}
 if(!initGL())use2D();document.body.dataset.waterRenderer=cv.dataset.renderer;resize();refresh();document.addEventListener('pointerdown',e=>{if(!motion()||e.target.closest('input,textarea,select,dialog,audio'))return;ring(e.clientX/innerWidth,e.clientY/innerHeight,27,1.2);wake();},{passive:true});
 window.addEventListener('resize',resize,{passive:true});window.addEventListener('scroll',measure,{passive:true});document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);raf=0;}else wake();});matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',()=>{A.fill(0);B.fill(0);wake();});
 return {begin,sound,playback,voice,refresh,wake,previewPulse(){if(motion())ring(.5,.65,30,.7);wake();},quiet(){V.ac=null;V.an=null;frequency=null;talking=false;wake();}};
})();
