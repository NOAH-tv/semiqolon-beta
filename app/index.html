<script>
'use strict';
const TOPICS=['위로','용기','감사','정보'];
// Keep original IDs and wording for saved-record comparisons. Information below is independently summarized from cited sources.
const TEXTS=[
['위로','오늘의 나에게','오늘 하루도 애썼습니다.\n잘해내지 못한 일이 있어도, 기울인 마음은 남아 있습니다.\n오늘은 이만큼이면 충분합니다.'],
['위로','잠시 멈추어도','계속 걸어야만 앞으로 가는 것은 아닙니다. 잠시 멈춰 서서 어디쯤 왔는지 돌아보는 시간도 길의 일부입니다. 오늘은 서두르지 않아도 됩니다. 물 한 잔을 마시고, 창밖의 빛을 보고, 다음 한 걸음을 천천히 골라 봅니다.'],
['위로','내 편이 되는 말','다른 사람에게는 다정한 말을 건네면서, 나에게는 유독 엄격한 날이 있습니다. 오늘만큼은 나에게도 같은 다정함을 건네 보세요. 잘못한 일 하나가 나의 전부는 아닙니다. 다시 해볼 수 있는 나는, 여전히 여기 있습니다.'],
['위로','완벽하지 않은 하루','계획대로 되지 않은 하루에도 남는 것이 있습니다. 누군가의 말을 끝까지 들어 준 순간, 조용히 정리한 자리, 힘들어도 지킨 작은 약속. 완벽하지 않았지만 아무것도 하지 않은 하루는 아닙니다. 오늘의 작은 수고를 알아줍니다.'],
['위로','조용한 자리','하루 종일 누군가를 부르고, 설명하고, 대답하느라 내 말을 들을 틈이 없었습니다. 이제는 나를 위한 조용한 자리를 하나 내어 봅니다. 멋진 말을 할 필요는 없습니다. 지금 마음에 남은 한 문장을, 내가 듣고 싶은 속도로 읽습니다.'],
['위로','마음의 속도','마음에는 저마다의 속도가 있습니다. 금방 괜찮아지는 일도 있고, 조금 더 시간이 필요한 일도 있습니다. 아직 정리되지 않았다고 나를 재촉하지 않습니다. 오늘의 마음은 오늘의 속도로, 천천히 지나가도록 두어도 괜찮습니다.'],
['위로','쉬어 가는 문장','오늘은 잘해야 한다는 말 대신, 쉬어 가도 된다는 말을 골라 봅니다. 잠깐 쉬었다고 그동안의 노력이 사라지지는 않습니다. 한 문장 사이에 쉼표가 있어야 다음 뜻이 잘 들리듯, 우리 하루에도 작은 쉼이 필요합니다.'],
['위로','여기까지 온 나','멀리 남은 길만 바라보면, 이미 걸어온 길을 잊기 쉽습니다. 오늘은 잠깐 뒤를 돌아봅니다. 처음에는 어려웠지만 이제는 할 수 있는 일들이 있습니다. 조금씩 배워 온 나에게, 여기까지 잘 왔다고 말해 줍니다.'],
['용기','작게 시작합니다','큰 결심이 없더라도 시작할 수 있습니다. 오늘은 한 문장을 끝까지 읽어 보는 일, 미뤄 둔 질문을 건네는 일, 작은 약속 하나를 지키는 일로 충분합니다. 작다는 이유로 의미가 없어지는 것은 아닙니다. 시작한 만큼, 오늘의 길이 생깁니다.'],
['용기','나의 말로','다른 사람의 표현이 멋져 보여도, 꼭 같은 말을 해야 하는 것은 아닙니다. 내가 알아들은 만큼, 내가 느낀 만큼 이야기해 봅니다. 서툴러도 나의 말에는 나의 시간이 담겨 있습니다. 오늘은 정답보다, 진심이 닿는 한 문장을 고릅니다.'],
['용기','질문할 수 있는 용기','모르는 것을 묻는 일은 부족함을 드러내는 일만은 아닙니다. 더 알고 싶다는 마음을 밖으로 꺼내는 일이기도 합니다. 오늘은 작은 질문 하나를 허락합니다. 질문이 생겼다는 것은, 아직 배울 것이 있고 앞으로 나아갈 길이 있다는 뜻입니다.'],
['용기','첫 번째 시도','처음 하는 일은 익숙한 일보다 오래 걸립니다. 말을 고르고, 손을 멈추고, 다시 확인할 때도 있습니다. 처음부터 능숙하지 않아도 됩니다. 오늘의 첫 번째 시도가 내일의 익숙함으로 이어질 수 있도록, 작은 시작을 남겨 둡니다.'],
['용기','조금 다른 선택','늘 같은 길을 걷다가도, 오늘은 조금 다른 선택을 해볼 수 있습니다. 먼저 인사를 건네거나, 내 생각을 한마디 보태거나, 쉬고 싶다고 말하는 일입니다. 크게 달라지지 않아도 괜찮습니다. 내가 선택했다는 사실을 기억해 둡니다.'],
['용기','목소리를 꺼내는 시간','하고 싶은 말이 마음속에서만 맴도는 날이 있습니다. 오늘은 그중 하나를 작게 꺼내 봅니다. 크게 말할 필요도, 단번에 끝낼 필요도 없습니다. 내가 편한 크기와 속도로 시작합니다. 한 문장을 말한 뒤에는, 내 목소리를 끝까지 들어 봅니다.'],
['용기','배우는 사람','가르치는 사람도 늘 배우고 있습니다. 예상하지 못한 질문에서 배우고, 잘되지 않은 설명을 돌아보며 배우고, 누군가의 새로운 시선에서 배웁니다. 모든 답을 알고 있어야만 좋은 만남을 만들 수 있는 것은 아닙니다. 함께 알아가는 마음도 힘이 됩니다.'],
['감사','작은 좋은 일','좋은 일이 꼭 큰 소식으로 찾아오는 것은 아닙니다. 따뜻한 물 한 잔, 뜻밖의 인사, 길가에 잠시 머문 햇빛처럼 작게 지나가기도 합니다. 오늘은 그중 하나를 천천히 떠올려 봅니다. 놓치지 않고 알아본 마음까지, 함께 기억해 둡니다.'],
['감사','함께한 사람','하루를 돌아보면 혼자 해낸 줄 알았던 일에도 다른 사람의 손길이 남아 있습니다. 먼저 건넨 인사, 조용한 도움, 기다려 준 시간. 오늘은 떠오르는 한 사람에게 고맙다는 말을 마음속으로 읽어 봅니다. 가능하다면 그 마음을 짧게 전해도 좋겠습니다.'],
['감사','익숙한 풍경','매일 보던 풍경도 천천히 바라보면 달라집니다. 창틀에 머무는 빛, 책상 위에 놓인 컵, 늘 지나치던 나무의 잎. 특별한 장소로 떠나지 않아도 오늘의 좋은 장면을 찾을 수 있습니다. 익숙함 속에서 발견한 한 가지를 내 말로 남겨 봅니다.'],
['감사','잘 들었던 순간','누군가 내 말을 끝까지 들어 주었던 순간을 기억합니다. 서둘러 답을 주지 않아도, 곁에서 기다려 주는 마음이 힘이 되었습니다. 오늘은 나도 내 목소리를 그렇게 들어 봅니다. 평가하기 전에 한 번 더 듣고, 말하려던 뜻을 천천히 알아봅니다.'],
['감사','오늘의 빈자리','해야 할 일로 가득한 하루에도 작은 빈자리가 있었습니다. 잠깐 창문을 연 시간, 천천히 걸은 몇 걸음, 아무 말 없이 쉬던 순간. 그 빈자리는 낭비가 아니라 나를 돌보던 시간일 수 있습니다. 오늘 내게 허락된 짧은 여유를 고맙게 기억합니다.'],
['감사','서로의 하루','같은 하루를 보내도 서로 다른 이야기를 품고 돌아옵니다. 누군가는 기쁜 일을, 누군가는 어려운 일을, 누군가는 아직 이름 붙이지 못한 마음을 가져옵니다. 오늘 만난 사람들의 하루를 다 알 수는 없지만, 한 번 더 다정하게 인사할 수는 있습니다.'],
['감사','나에게 고마운 일','오늘 나에게 고마웠던 일을 하나 골라 봅니다. 물을 챙겨 마신 일, 잠깐 쉬어 준 일, 하기 어려운 말을 조심스럽게 꺼낸 일. 작아 보여도 나를 위해 한 선택입니다. 다른 사람에게 고마워하듯, 나에게도 짧은 고마움을 건넵니다.'],
['용기','다음 문장','한 문장이 끝났다고 이야기가 모두 끝나는 것은 아닙니다. 잠시 멈춘 자리 뒤에 다음 문장을 이어 쓸 수 있습니다. 어제와 똑같이 할 필요도 없습니다. 오늘의 나는 오늘의 방식으로, 작고 새로운 한 줄을 시작해 봅니다.'],
['용기','새로운 아침','어제의 마음이 오늘까지 남아 있어도, 아침은 다시 찾아옵니다. 모든 것을 새롭게 할 필요는 없습니다. 익숙한 자리 하나를 정리하고, 오늘 하고 싶은 일 하나를 고릅니다. 새로 시작한다는 것은, 작은 선택을 다시 해보는 일이기도 합니다.'],
['용기','미뤄 둔 일','미뤄 둔 일을 떠올리면, 시작하기도 전에 마음이 무거워질 때가 있습니다. 오늘은 끝내야 할 일 전체 대신 첫 단계만 바라봅니다. 책을 펼치거나, 한 줄을 쓰거나, 필요한 것을 찾아보는 일. 그 작은 시작 뒤에 다음 단계를 골라도 늦지 않습니다.'],
['용기','잘되지 않은 날 뒤에','잘되지 않은 하루를 지나면, 다음 시도까지 두려워질 수 있습니다. 그렇지만 한 번의 결과가 앞으로의 모든 날을 정하지는 않습니다. 오늘은 무엇이 어려웠는지 하나만 알아봅니다. 그리고 바꿔볼 수 있는 작은 부분에서 다시 시작합니다.'],
['용기','내가 정한 만큼','오래 쉬었다고 처음부터 모두 되돌릴 필요는 없습니다. 오늘 할 수 있는 만큼을 정해 봅니다. 짧게 읽고, 잠깐 듣고, 여기까지 했다고 표시합니다. 어제의 기준이 아닌 오늘의 나에게 맞는 크기로 시작하면, 다음 만남도 조금 편해질 수 있습니다.'],
['용기','돌아오는 연습','꾸준함은 한 번도 멈추지 않는 일만을 뜻하지는 않습니다. 멈춘 뒤에 다시 돌아오는 일도 꾸준함의 일부입니다. 어제 하지 못한 일을 벌처럼 갚지 않습니다. 오늘의 한 문장을 새롭게 읽고, 돌아온 나를 반갑게 맞이합니다.'],
['용기','다르게 읽어 봅니다','같은 문장도 다시 읽으면 다른 말이 마음에 남습니다. 처음에는 지나쳤던 단어에서 잠깐 멈추고, 내가 전하고 싶은 뜻을 골라 봅니다. 모든 말을 바꿀 필요는 없습니다. 오늘은 단어 하나에 마음을 담아, 같은 문장을 다르게 읽어 봅니다.'],
['용기','내일의 나에게','오늘의 목소리를 남겨 두는 것은 내일의 나에게 작은 편지를 보내는 일과 닮았습니다. 잘한 점만 남기지 않아도 됩니다. 지금의 속도와 망설임, 끝까지 말해 본 시간도 함께 담깁니다. 내일 다시 들을 나에게, 오늘의 한 문장을 건넵니다.']
].map(([topic,title,text],i)=>({id:'sq-original-20261001-'+String(i+1).padStart(2,'0'),topic,title,text,source:'SEMIQOLON · 자체 작성 초안',version:1}));

 {id:'sq-info-space-crops-20260930',kind:'이슈',publishedAt:'2026-09-30',title:'달에서 키울 작물을 준비합니다',text:'미국과 캐나다, 독일의 우주 연구기관이 달에서 작물을 기르기 위한 공동 준비에 나섰습니다. 먼저 지구에 시험 시설을 마련해, 달 기지에서 예상되는 환경을 연구하려는 계획입니다. 작물은 먹거리가 될 뿐 아니라 산소를 만들고 물을 다시 쓰는 데도 도움을 줄 수 있습니다.',source:'NASA',sourceUrl:'https://science.nasa.gov/science-research/biological-physical-sciences/nasa-international-partners-advance-work-on-space-crops/'},
 {id:'sq-info-sound-light-v1',kind:'지식',title:'빛은 오고, 소리는 오지 않는 이유',text:'소리는 공기나 물 같은 물질의 떨림을 따라 전달됩니다. 그래서 공기가 없는 진공에서는 소리가 전해지지 않습니다. 빛은 다릅니다. 빛은 물질의 도움 없이도 진공을 지나갈 수 있습니다. 우리가 우주의 별빛을 볼 수 있는 것도 이 때문입니다.',source:'NASA',sourceUrl:'https://science.nasa.gov/ems/02_anatomy/'},

function dbOp(mode,fn){return new Promise((resolve,reject)=>{if(!state.db)return reject(Error('storage'));const tx=state.db.transaction('recordings',mode);let req;try{req=fn(tx.objectStore('recordings'));}catch(e){reject(e);return;}tx.oncomplete=()=>resolve(req?.result);tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||Error('storage'));});}
async function persist(r){try{const packed=await DeviceVoice.pack(r);await dbOp('readwrite',s=>s.put(packed));const saved=await dbOp('readonly',s=>s.get(r.id));if(saved?.audioBytes?.byteLength!==r.audio.size)throw Error('storage');r.unsaved=false;}catch{r.unsaved=true;}if(!state.records.some(x=>x.id===r.id))state.records.unshift(r);return !r.unsaved;}
function wave(pcm,sampleRate,bits=24){const bytes=bits/8,size=pcm.length*bytes,padded=size+(size%2),buffer=new ArrayBuffer(44+padded),v=new DataView(buffer),tag=(at,s)=>[...s].forEach((c,i)=>v.setUint8(at+i,c.charCodeAt(0)));tag(0,'RIFF');v.setUint32(4,36+padded,true);tag(8,'WAVE');tag(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sampleRate,true);v.setUint32(28,sampleRate*bytes,true);v.setUint16(32,bytes,true);v.setUint16(34,bits,true);tag(36,'data');v.setUint32(40,size,true);for(let i=0;i<pcm.length;i++){const x=Math.max(-1,Math.min(1,pcm[i]));if(bits===16)v.setInt16(44+i*2,Math.round(x*(x<0?32768:32767)),true);else{const n=Math.round(x*(x<0?8388608:8388607));v.setUint8(44+i*3,n&255);v.setUint8(45+i*3,(n>>8)&255);v.setUint8(46+i*3,(n>>16)&255);}}return new Blob([buffer],{type:'audio/wav'});}
async function analyzeRecord(r,input=r.audio){if(state.jobs.has(r.id))return;const controller=new AbortController();state.jobs.set(r.id,controller);if(state.view==='result'&&state.current===r)refreshResult(r);try{const decoded=await decodeAudio(input);if(controller.signal.aborted)return;let pcm=decoded.pcm,sr=decoded.sr;if(sr>48000){const ratio=sr/48000,out=new Float32Array(Math.floor(pcm.length/ratio));for(let i=0;i<out.length;i++){const at=i*ratio,j=Math.floor(at),f=at-j;out[i]=pcm[j]*(1-f)+(pcm[j+1]??pcm[j])*f;}pcm=out;sr=48000;}
const m=await DeviceVoice.analyze(wave(pcm,sr,16),controller.signal);if(controller.signal.aborted||!state.records.includes(r))return;r.metrics={...m,comparisonKey:m.comparisonKey+':'+sr};if(r.sentenceId===VoicePractice.VOWEL.id)r.resonance=await VoicePractice.resonance(pcm,sr,controller.signal);if(controller.signal.aborted||!state.records.includes(r))return;await persist(r);
}catch{if(!controller.signal.aborted)r.analysisError=true;}finally{state.jobs.delete(r.id);if(state.view==='result'&&state.current===r)refreshResult(r);else if(state.view==='history')render();if(!controller.signal.aborted&&state.records.includes(r)&&r.metrics?.status==='ready'&&!r.transcript)VoicePractice.transcribe(r);}}
function refreshResult(r){const old=document.querySelector('[data-metric]');if(old){const t=document.createElement('template');t.innerHTML=resultMetric(r);t.content.firstElementChild.open=old.open;old.replaceWith(t.content.firstElementChild);}const compare=$('result-comparison');if(compare)compare.innerHTML=compareMarkup(r);const next=$('voice-next');if(next)next.innerHTML=VoicePractice.next(r);}
async function decodeAudio(blob){const ac=new (window.AudioContext||window.webkitAudioContext)();try{const b=await ac.decodeAudioData(await blob.arrayBuffer());return {pcm:b.getChannelData(0).slice(),sr:b.sampleRate};}finally{await ac.close();}}
async function startRecording(){if(state.capture||state.starting||state.stopping)return;if(!state.loaded){toast('기록을 불러온 뒤 시작해 주세요.');return;}state.starting=true;state.error='';render();document.querySelectorAll('audio').forEach(a=>a.pause());let ac,stream,r;try{if(!navigator.mediaDevices?.getUserMedia)throw Error('unsupported');try{ac=new (window.AudioContext||window.webkitAudioContext)({sampleRate:48000,latencyHint:'interactive'});}catch{ac=new (window.AudioContext||window.webkitAudioContext)();}await ac.resume();stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,sampleRate:48000,echoCancellation:false,noiseSuppression:false,autoGainControl:false}});await ac.resume();r={stream,ac,started:Date.now(),story:{...story()},inputKey:JSON.stringify(stream.getAudioTracks()[0].getSettings()),baselineId:state.baseline?.id||null,voiceGoal:state.onboarding?null:profile?.voiceGoal,chunks:[],nodes:[]};const source=ac.createMediaStreamSource(stream),sink=ac.createGain(),an=ac.createAnalyser();sink.gain.value=0;source.connect(an);an.fftSize=4096;r.meter=new Float32Array(an.fftSize);r.an=an;sink.connect(ac.destination);r.nodes=[source,sink,an];state.capture=r;await DeviceVoice.capture(r,source,sink,()=>state.capture===r);state.starting=false;render();r.session={kind:'read',attempt:crypto.randomUUID(),voiceSeconds:0,waterSeconds:(r.baselineId||state.onboarding&&r.story.id===VoicePractice.VOWEL.id)?(state.current?.waterSeconds||state.current?.voicedSeconds||0):0,guided:!!r.baselineId,take:r.baselineId?2:1};Water.begin(r.session);ReadingFeedback.begin(r);r.lastPitch=performance.now();r.pitchMeter=DeviceVoice.pitchMeter(pitch=>{if(state.capture!==r||state.stopping)return;const now=performance.now(),dt=Math.min(.2,(now-r.lastPitch)/1000);r.lastPitch=now;if(!document.hidden&&r.ac.state==='running'&&pitch&&pitch<=500)r.session.voiceSeconds+=dt;Water.sound(r.session);VoicePractice.live(pitch);});r.interval=setInterval(()=>{if(!state.capture||document.hidden)return;const timer=$('timer');if(timer)timer.textContent=seconds((Date.now()-r.started)/1000);an.getFloatTimeDomainData(r.meter);const power=Math.sqrt(r.meter.reduce((n,v)=>n+v*v,0)/r.meter.length);r.inputDb=VoicePractice.inputLevel(power).db;const liveDb=$('live-db');if(liveDb)liveDb.textContent=VoicePractice.dbText(r.inputDb);r.pitchMeter.sample(r.meter,r.ac.sampleRate);Water.voice(r,power);if($('input-level'))$('input-level').style.width=Math.min(100,power*500)+'%';if($('capture-status'))$('capture-status').textContent=ac.state==='running'?'녹음 중':'입력이 잠시 멈췄어요';},120);r.limit=setTimeout(()=>{if(r.story.id!==VoicePractice.VOWEL.id)toast('90초까지 남겼어요.');stopRecording();},r.story.id===VoicePractice.VOWEL.id?4000:90000);stream.getAudioTracks()[0].onended=()=>{if(state.capture===r){toast('마이크가 꺼져 여기까지 남겼어요.');stopRecording();}};navigator.wakeLock?.request('screen').then(lock=>r.wakeLock=lock).catch(()=>{});
}catch(e){ReadingFeedback.stop(r);r?.pitchMeter?.close();clearInterval(r?.interval);clearTimeout(r?.limit);state.capture=null;state.starting=false;stream?.getTracks().forEach(t=>t.stop());ac?.close().catch(()=>{});state.error=e.name==='NotAllowedError'?'마이크 사용을 허용해 주세요. 설정을 바꾼 뒤 다시 녹음할 수 있어요.':e.name==='NotFoundError'?'사용할 수 있는 마이크가 없어요. 연결 상태를 확인해 주세요.':'마이크를 시작하지 못했어요. HTTPS 또는 로컬 미리보기에서 열고 마이크를 확인해 주세요.';render();}}
async function stopRecording(){const r=state.capture;if(!r||state.stopping)return;state.stopping=true;ReadingFeedback.stop(r);render();if(r.worklet)await new Promise(resolve=>{const timer=setTimeout(resolve,500);r.flushed=()=>{clearTimeout(timer);resolve();};try{r.worklet.port.postMessage('flush');}catch{clearTimeout(timer);resolve();}});clearInterval(r.interval);clearTimeout(r.limit);r.pitchMeter?.close();document.body.dataset.pitchFeedback='idle';r.stream.getTracks().forEach(t=>{t.onended=null;t.stop();});r.nodes.forEach(n=>{try{n.disconnect();}catch{}});r.wakeLock?.release().catch(()=>{});await r.ac.close().catch(()=>{});state.capture=null;Water.quiet();
 const count=r.chunks.reduce((n,x)=>n+x.length,0),pcm=new Float32Array(count);let at=0;for(const x of r.chunks){pcm.set(x,at);at+=x.length;}if(pcm.length/r.ac.sampleRate<.5){state.stopping=false;state.error='녹음이 너무 짧아요. 글을 읽은 뒤 정지를 눌러 주세요.';state.view='read';render();return;}
 const q=r.story;const recorded=state.current={id:crypto.randomUUID(),sentenceId:q.id,scriptId:q.scriptId,scriptVersion:q.scriptVersion,scriptPart:q.scriptPart,scriptParts:q.scriptParts,topic:q.topic,title:q.title,text:q.text,source:q.source,sourceUrl:q.sourceUrl,kind:q.kind,publishedAt:q.publishedAt,checkedAt:q.checkedAt,version:q.version,ts:r.started,duration:pcm.length/r.ac.sampleRate,audio:wave(pcm,r.ac.sampleRate),sampleRate:r.ac.sampleRate,bits:24,inputKey:r.inputKey,baselineId:r.baselineId,voiceGoal:r.voiceGoal,readingProgress:r.readingProgress||0,voicedSeconds:r.session?.voiceSeconds||0,waterSeconds:(r.session?.waterSeconds||0)+(r.session?.voiceSeconds||0),goal,metrics:null,listened:false};await persist(recorded);state.stopping=false;state.baseline=null;state.back='home';state.view='result';render();analyzeRecord(recorded);}
function downloadRecord(r){const u=URL.createObjectURL(r.audio),a=document.createElement('a');a.href=u;a.download=`SEMIQOLON_${key(new Date(r.ts))}_${r.id.slice(0,8)}_24bit.wav`;a.click();setTimeout(()=>URL.revokeObjectURL(u),30000);}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b||b.disabled||state.starting||state.stopping)return;if(state.capture&&b.dataset.action!=='stop')return;try{if(await ScriptLibrary.actions(b))return;if(VoiceHistory.actions(b)||await VoicePractice.actions(b))return;
 if(b.dataset.topic){state.topic=b.dataset.topic;state.choice=dailyIndex(state.topic);state.baseline=null;render();return;}
 if(b.dataset.goal){goal=b.dataset.goal;render();return;}
 if(b.dataset.go){navigate(b.dataset.go);return;}
 if(b.dataset.record){state.current=state.records.find(r=>r.id===b.dataset.record);state.back='history';navigate('result');if(!state.current.transcript)VoicePractice.transcribe(state.current);return;}
 if(b.dataset.reread){const r=state.records.find(x=>x.id===b.dataset.reread);state.baseline=r;state.back='result';navigate('read');return;}
 if(b.dataset.download){downloadRecord(state.records.find(r=>r.id===b.dataset.download));return;}
 if(b.dataset.analyze){const r=state.records.find(r=>r.id===b.dataset.analyze);analyzeRecord(r);render();return;}
 if(b.dataset.delete){if(!confirm('이 녹음과 분석 기록을 삭제할까요?'))return;const r=state.records.find(x=>x.id===b.dataset.delete);await dbOp('readwrite',s=>s.delete(r.id));state.jobs.get(r.id)?.abort();VoicePractice.cancel(r.id);state.records=state.records.filter(x=>x!==r);if(state.urls.has(r.id)){URL.revokeObjectURL(state.urls.get(r.id));state.urls.delete(r.id);}state.current=null;state.baseline=null;navigate('history');toast('이 기록을 삭제했어요.');return;}
 switch(b.dataset.action){case'connect-analysis':if(await window.BetaAccess?.connect())toast('정밀 분석을 연결했어요.');break;case'home':state.baseline=null;state.before=null;if(['reference','vowel'].includes(state.choice))state.choice=dailyIndex(state.topic);navigate('home');break;case'history':navigate('history');break;case'about':navigate('about');break;case'begin':profile={goal};try{localStorage.setItem('sq-first-profile',JSON.stringify(profile));}catch{}navigate('home');break;case'another':{const pool=TEXTS.map((q,i)=>q.topic===state.topic?i:-1).filter(i=>i>=0);state.choice=pool[(pool.indexOf(state.choice)+1)%pool.length];state.baseline=null;render();break;}case'read-now':state.baseline=null;state.before=null;state.back='home';navigate('read');await startRecording();break;case'record':await startRecording();break;case'stop':await stopRecording();break;case'done':if(state.current){state.current.completedAt=Date.now();await persist(state.current);}navigate('done');break;case'reference':state.baseline=null;state.before=null;state.choice='reference';state.back='history';navigate('read');break;}
 }catch{toast('처리하지 못했어요. 녹음은 남아 있으니 다시 시도해 주세요.');}});
document.addEventListener('play',async e=>{const audio=e.target;if(audio.tagName!=='AUDIO')return;document.querySelectorAll('audio').forEach(a=>{if(a!==audio)a.pause();});try{playbackContext??=new (window.AudioContext||window.webkitAudioContext)();let node=playbackNodes.get(audio);if(!node){const source=playbackContext.createMediaElementSource(audio),an=playbackContext.createAnalyser();an.fftSize=1024;source.connect(an);an.connect(playbackContext.destination);node={source,an,connected:true};playbackNodes.set(audio,node);}if(!node.connected){node.source.connect(node.an);node.an.connect(playbackContext.destination);node.connected=true;}await playbackContext.resume();if(audio.paused){node.source.disconnect();node.an.disconnect();node.connected=false;return;}clearInterval(glassPlayback?.timer);const r=glassPlayback={audio,ac:playbackContext,an:node.an,meter:new Float32Array(node.an.fftSize)};r.timer=setInterval(()=>{if(audio.paused||!audio.isConnected){stopPlaybackWater(audio);return;}r.an.getFloatTimeDomainData(r.meter);const power=Math.sqrt(r.meter.reduce((n,v)=>n+v*v,0)/r.meter.length);Water.voice(r,power);Water.playback(r,Number.isFinite(audio.duration)?audio.currentTime/audio.duration:0);},100);}catch{toast('물결 반응을 시작하지 못했어요. 음성은 재생할 수 있어요.');}},true);
function stopPlaybackWater(audio){if(glassPlayback?.audio!==audio)return;clearInterval(glassPlayback.timer);const node=playbackNodes.get(audio);node?.source.disconnect();node?.an.disconnect();if(node)node.connected=false;glassPlayback=null;if(!state.capture)Water.quiet();}
document.addEventListener('pause',e=>stopPlaybackWater(e.target),true);

async function init(){state.choice=dailyIndex(state.topic);state.view=profile?.voiceSetup?'home':'welcome';render();try{state.db=await new Promise((resolve,reject)=>{const req=indexedDB.open('semiqolon-first-product-v1',1);req.onupgradeneeded=()=>req.result.createObjectStore('recordings',{keyPath:'id'});req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);req.onblocked=()=>reject(Error('blocked'));});state.records=(await dbOp('readonly',s=>s.getAll())).map(DeviceVoice.unpack).sort((a,b)=>b.ts-a.ts);}catch{toast('브라우저 저장을 사용할 수 없어요. 녹음 후 WAV를 내려받아 주세요.');}state.loaded=true;render();}
